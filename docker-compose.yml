version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: onkorea_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_onkorea
      MYSQL_DATABASE: onkorea_db
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    ports:
      - "3309:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pmy_root_password"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
    driver: local
