spring:
  application:
    name: "onkorea-be"

  profiles:
    active: local

  # MVC 설정
  mvc:
    throw-exception-if-no-handler-found: true

  # 정적 리소스 핸들링 비활성화 (REST API 서버이므로)
  web:
    resources:
      add-mappings: false

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver

    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3309}/${DB_NAME:onkorea_db}?useSSL=false&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root_onkorea}

  security:
    oauth2:
      client:
        registration:
          google:
            # 승인된 리디렉션 URI: http://localhost:8080/login/oauth2/code/google
            client-id: ${GOOGLE_CLIENT_ID:YOUR_GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET:YOUR_GOOGLE_CLIENT_SECRET}
            scope:
              - profile
              - email

  jpa:
    hibernate:
      # create: 매번 테이블 재생성 (개발 초기)
      # update: 변경사항만 반영 (개발/테스트)
      # validate: 스키마 검증만 (운영)
      # none: 아무것도 안함 (운영 권장)
      ddl-auto: create
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

springdoc:
  override-with-generic-response: true
  default-consumes-media-type: application/json
  default-produces-media-type: application/json
  show-javadoc: true
  swagger-ui:
    doc-expansion: list
    enabled: true
    operations-sorter: method
    path: "/swagger.html"
    tags-sorter: alpha
  api-docs:
    enabled: true
    path: "/v3/api-docs"

swagger:
  servers:
    - url: http://localhost:8080
      description: Local Server

jwt:
  secret: ${JWT_SECRET:your-secret-key-for-jwt-token-generation-must-be-at-least-256-bits-long}
  expiration: 86400000  # 24시간 (밀리초)

# CORS 설정
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# 서버 에러 응답 설정
server:
  error:
    # 에러 응답에 예외 클래스명 포함 여부
    include-exception: false
    # 에러 응답에 메시지 포함 여부 (always, never, on_param)
    include-message: always
    # 에러 응답에 스택트레이스 포함 여부 (always, never, on_param)
    include-stacktrace: never
    # 에러 응답에 바인딩 에러 포함 여부 (always, never, on_param)
    include-binding-errors: always
    # HTML 화이트라벨 에러 페이지 비활성화
    whitelabel:
      enabled: false

# Actuator 설정
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
